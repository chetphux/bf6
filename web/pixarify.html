<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R U DOWN?</title>
  <style>
    :root{
      --text:#ecf3ff;
      --muted:#a7b6d2;
      --panel-a:#091224d1;
      --panel-b:#101a2dd9;
      --border:#3a4f75;
      --accent:#ffc36a;
      --accent-2:#9ac9ff;
      --ok:#9afac8;
      --danger:#ff9b9b;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
body{
  color:var(--text);
  font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:url("/down.jpg") repeat;
  position:relative;
  overflow-x:hidden;
}
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-2;
      background:
        radial-gradient(circle at 50% 34%, #08111d2b 0%, #08111d78 45%, #050b14de 100%),
        linear-gradient(180deg, #07102261 0%, #071022bf 64%, #050a13eb 100%);
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      background:
        radial-gradient(640px 280px at 50% 14%, #ffc27d30, transparent 66%),
        radial-gradient(500px 250px at 18% 18%, #8dc9ff24, transparent 70%),
        radial-gradient(500px 260px at 82% 18%, #ff8d6b1f, transparent 72%);
      mix-blend-mode:screen;
    }
    .wrap{
      min-height:85vh;
      min-height:85svh;
      min-height:85dvh;
      max-width:1200px;
      margin:0 auto;
      padding:22px 18px 30px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .topline{
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{
      background:#0b1526a8;
      border:1px solid #4f61848a;
      border-radius:18px;
      padding:14px 18px;
      backdrop-filter:blur(8px);
      box-shadow:0 8px 24px #02060f52;
      text-align:center;
    }
    .brand h1{
      margin:0;
      font-size:clamp(36px,8vw,60px);
      letter-spacing:.08em;
      line-height:.9;
      color:#f6f9ff;
      text-shadow:0 4px 18px #00000088;
    }
    .brand p{
      margin:10px auto 0;
      color:var(--muted);
      font-size:14px;
      max-width:640px;
    }
    .hero{
      margin-top:auto;
      background:linear-gradient(132deg, var(--panel-a), var(--panel-b));
      border:1px solid #4255769a;
      border-radius:24px;
      padding:18px;
      backdrop-filter:blur(1px);
      box-shadow:0 14px 42px #00000070;
    }
    .drop{
      border:2px dashed #5e7cad;
      border-radius:16px;
      min-height:120px;
      display:grid;
      place-items:center;
      text-align:center;
      padding:20px;
      background:linear-gradient(180deg, #0d1a31a6, #0c1728b0);
      transition:border-color .2s ease, background .2s ease, transform .2s ease;
    }
    .drop p{margin:0;color:#b4c2dd}
    .drop strong{color:var(--accent)}
    .drop.drag{
      border-color:#ffca78;
      background:linear-gradient(180deg, #1a2138c2, #141f34d1);
      transform:translateY(-1px);
    }
    #fileInput{display:none}
    .actions{
      margin-top:14px;
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }
    button{
      border:1px solid #ab6e2b;
      background:linear-gradient(180deg, #ffc472, #f39d46);
      color:#251506;
      font-weight:700;
      border-radius:12px;
      padding:10px 16px;
      cursor:pointer;
      box-shadow:0 10px 20px #d579122e;
    }
    button:hover:not(:disabled){filter:brightness(1.03)}
    button:disabled{
      cursor:not-allowed;
      opacity:.64;
      box-shadow:none;
    }
    .status{color:var(--muted)}
    .status.error{color:var(--danger)}
    .status.ok{color:var(--ok)}
    .grid{
      margin-top:16px;
      display:grid;
      grid-template-columns:minmax(220px, .9fr) minmax(280px, 1.1fr);
      gap:14px;
      align-items:stretch;
    }
    .card{
      border:1px solid #445a7f8f;
      background:#0b1424b3;
      border-radius:16px;
      padding:12px;
      display:flex;
      flex-direction:column;
      min-height:310px;
      transition:border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    }
    .card h2{
      margin:0 0 10px;
      font-size:13px;
      color:#b4c3e0;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-weight:700;
    }
    .card.result.ready{
      border-color:#ffcb7f;
      box-shadow:0 0 0 1px #ffcb7f44, 0 12px 30px #e58f2038;
      transform:translateY(-2px);
    }
    .preview{
      width:100%;
      min-height:250px;
      height:100%;
      max-height:560px;
      border-radius:12px;
      border:1px solid #2f4464;
      object-fit:contain;
      background:#08101d;
      display:none;
      flex:1;
    }
    .preview.show{display:block}
    .empty{
      color:#8ea2c5;
      border:1px dashed #35507a;
      border-radius:12px;
      min-height:250px;
      display:grid;
      place-items:center;
      text-align:center;
      padding:12px;
      flex:1;
    }
    .meta{
      margin-top:12px;
      color:#c0cde6;
      font-size:13px;
      min-height:20px;
      padding:8px 10px;
      border:1px solid #4358796e;
      border-radius:10px;
      background:#0e1a2e8c;
      width:fit-content;
      max-width:100%;
    }
    .open-link{
      display:inline-block;
      margin-top:10px;
      color:#ffe1a8;
      text-decoration:none;
      border:1px solid #83634388;
      border-radius:999px;
      padding:6px 10px;
      width:fit-content;
      background:#1a1a1f86;
    }
    .open-link:hover{border-color:#e4b26c}
    @media (max-width:980px){
      body{background-position:top left}
      .hero{margin-top:0}
      .grid{grid-template-columns:1fr}
      .card{min-height:280px}
      .brand h1{font-size:clamp(32px,13vw,52px)}
    }
    @media (max-width:700px){
      .wrap{
        width:min(calc(100% - 32px), 460px);
          min-height:100vh;
        min-height:100svh;
        min-height:100dvh;
        padding:10px 0 14px;
        padding:calc(10px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom));
        gap: clamp(12px, 7vh, 100px);
      }
      body{
        background-size:auto;
        background-position:top left;
      }
      body::before{
        background:
          radial-gradient(circle at 50% 34%, #08111d0f 0%, #08111d33 45%, #050b148c 100%),
          linear-gradient(180deg, #0710221f 0%, #07102263 64%, #050a138f 100%);
      }
      .brand{
        padding:10px 12px;
        background:#0b15265f;
      }
      .brand h1{font-size:clamp(30px,11vw,44px)}
      .brand p{font-size:13px}
      .hero{
        padding:10px;
        border-radius:16px;
        background:linear-gradient(132deg, #09122480, #101a2d8c);
      }
      .drop{
        min-height:88px;
        padding:12px;
        background:linear-gradient(180deg, #0d1a3154, #0c172865);
      }
      .card{
        padding:10px;
        background:#0b142434;
      }
      .preview,.empty{min-height:180px}
      .actions{gap:8px}
      .meta{
        width:100%;
        background:#0e1a2e66;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topline">
      <div class="brand">
        <h1>R U DOWN?</h1>
        <p>Drop in a photo, get DOWN with the render, and keep it live on the server for 15 minutes.</p>
      </div>
    </div>

    <section class="hero">
      <label class="drop" id="dropZone" for="fileInput">
        <p><strong>Drop an image here</strong> or click to choose one (JPG, PNG, WEBP)</p>
      </label>
      <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" />

      <div class="actions">
        <button id="runBtn" disabled>DOWNIFY</button>
        <span id="status" class="status">No image selected.</span>
      </div>

      <div class="grid">
        <article id="originalCard" class="card original">
          <h2>Original</h2>
          <div id="emptyOriginal" class="empty">Your original image preview appears here.</div>
          <img id="originalPreview" class="preview" alt="Original upload preview" />
        </article>
        <article id="resultCard" class="card result">
          <h2>Downed Result</h2>
          <div id="emptyResult" class="empty">Generated image appears here after processing.</div>
          <img id="resultPreview" class="preview" alt="Downed output preview" />
          <a id="openLink" class="open-link" target="_blank" rel="noreferrer" style="display:none">Open full image</a>
        </article>
      </div>

      <div id="meta" class="meta"></div>
    </section>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const runBtn = document.getElementById("runBtn");
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");
    const originalPreview = document.getElementById("originalPreview");
    const resultPreview = document.getElementById("resultPreview");
    const emptyOriginal = document.getElementById("emptyOriginal");
    const emptyResult = document.getElementById("emptyResult");
    const openLink = document.getElementById("openLink");
    const resultCard = document.getElementById("resultCard");

    let selectedFile = null;
    let lastObjectUrl = "";

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function showOriginal(file) {
      if (lastObjectUrl) {
        URL.revokeObjectURL(lastObjectUrl);
      }
      lastObjectUrl = URL.createObjectURL(file);
      originalPreview.src = lastObjectUrl;
      originalPreview.classList.add("show");
      emptyOriginal.style.display = "none";
    }

    function pickFile(file) {
      if (!file) return;
      selectedFile = file;
      showOriginal(file);
      runBtn.disabled = false;
      setStatus(`Selected: ${file.name}`);
      metaEl.textContent = "";
    }

    function clearResult() {
      resultPreview.classList.remove("show");
      resultPreview.removeAttribute("src");
      emptyResult.style.display = "grid";
      openLink.style.display = "none";
      resultCard.classList.remove("ready");
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      clearResult();
      pickFile(file);
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add("drag");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove("drag");
      });
    });

    dropZone.addEventListener("drop", (event) => {
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      clearResult();
      pickFile(file);
    });

    runBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      runBtn.disabled = true;
      setStatus("Getting down with the image...");
      metaEl.textContent = "";
      resultCard.classList.remove("ready");

      const formData = new FormData();
      formData.append("image", selectedFile);

      try {
        const response = await fetch("/api/rudown", { method: "POST", body: formData });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || "Generation failed.");
        }

        const imageUrl = `${payload.image_url}?t=${Date.now()}`;
        resultPreview.src = imageUrl;
        resultPreview.classList.add("show");
        emptyResult.style.display = "none";
        resultCard.classList.add("ready");

        openLink.href = payload.image_url;
        openLink.textContent = "Open full image";
        openLink.style.display = "inline-block";

        const expires = payload.expires_at ? new Date(payload.expires_at) : null;
        const expiresText = expires && !Number.isNaN(expires.valueOf())
          ? expires.toLocaleString()
          : "about 15 minutes";
        metaEl.textContent = `Saved on server until: ${expiresText}`;
        setStatus("Done.", "ok");
      } catch (error) {
        setStatus(error.message || "Failed to generate image.", "error");
        resultCard.classList.remove("ready");
      } finally {
        runBtn.disabled = !selectedFile;
      }
    });
  </script>
</body>
</html>
